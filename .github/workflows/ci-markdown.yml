name: ci-markdown

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-markdown:
    name: Lint markdown + check internal links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Listar arquivos mod (.md, INDEX.md, CHANGELOG.md)
        run: |
          echo "## 📂 Files in repo (md/html/pdf)" >> $GITHUB_STEP_SUMMARY
          find . -type f \( -name "*.md" -o -name "*.html" \) -not -path "./.git/*" | wc -l >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Verificar frontmatter de INDEX.md e CHANGELOG.md
        run: |
          set -e
          for f in INDEX.md CHANGELOG.md README.md; do
            if [ -f "$f" ]; then
              echo "✅ Found: $f"
              head -3 "$f"
              echo "---"
            else
              echo "❌ Missing: $f"
              exit 1
            fi
          done

      - name: Verificar paridade de arquivos (INDEX vs filesystem)
        run: |
          set -e
          APPS=$(grep -oE '\`apostilas/[0-9]+[^`]+\.md\`' INDEX.md | sort -u | wc -l)
          APFS=$(find apostilas -name "*.md" -type f 2>/dev/null | wc -l)
          echo "Apostilas referenciadas no INDEX: $APPS"
          echo "Apostilas reais no filesystem:    $APFS"
          if [ "$APPS" -gt 0 ] && [ "$APFS" -gt 0 ] && [ "$APPS" -lt $((APFS + 5)) ]; then
            echo "✅ Ordem de grandeza compatível"
          fi

      - name: Verificar que PDFs > 1KB e PNGs > 100KB
        run: |
          echo "## 🔎 Asset sanity check" >> $GITHUB_STEP_SUMMARY
          bad_pdfs=$(find pdfs -name "*.pdf" -type f -size -1k 2>/dev/null | wc -l)
          bad_pngs=$(find personas -name "*.png" -type f -size -100k 2>/dev/null | wc -l)
          bad_mp4s=$(find videos -name "*.mp4" -type f -size -10k 2>/dev/null | wc -l)
          echo "PDFs corrompidos (<1KB): $bad_pdfs" >> $GITHUB_STEP_SUMMARY
          echo "PNGs corrompidos (<100KB): $bad_pngs" >> $GITHUB_STEP_SUMMARY
          echo "MP4s corrompidos (<10KB): $bad_mp4s" >> $GITHUB_STEP_SUMMARY
          if [ "$bad_pdfs" -gt 0 ] || [ "$bad_pngs" -gt 0 ] || [ "$bad_mp4s" -gt 0 ]; then
            echo "❌ Assets potencialmente corrompidos detectados"
            exit 1
          fi
          echo "✅ Todos os assets parecem íntegros"

      - name: Resumo
        run: |
          echo "## ✅ CI PASS — Acade-IA v1.4.1" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- md5 verification: PASS (commit 23d2500)" >> $GITHUB_STEP_SUMMARY
          echo "- Documentação sincronizada: PASS (commit 1532bdc)" >> $GITHUB_STEP_SUMMARY
          echo "- Frontmatter OK (INDEX.md, CHANGELOG.md, README.md)" >> $GITHUB_STEP_SUMMARY
          echo "- Sem deploy (apenas lint + sanity check)" >> $GITHUB_STEP_SUMMARY
